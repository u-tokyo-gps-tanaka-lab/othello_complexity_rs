[package]
name = "othello_complexity_rs"
version = "1.0.0"
edition = "2021"

[dependencies]
proconio = "0.4.5"
ac-library-rs = "0.1.1"
rustsat-kissat = { version= "0.7", features = ["v4-0-4"] }
rustsat = { version = "0.7", features = ["fxhash", "rand"] }
rand = "0.9.2"
rand_chacha = "=0.9.0"
serde_json = "1"
csv = "1"
sha2 = "0.10"
rayon = "1.10"
dashmap = "6"
clap = { version = "4", features = ["derive", "env"] }
bytemuck= "1.23.2"
statrs = "0.18.0"
bigdecimal = "0.4"
highs = "1"
highs-sys = "1"
crossbeam-skiplist = "0.1"
crossbeam = "0.8"
ordered-float = "4"
flurry = "0.5"
rapidhash = "4.2.2"
foldhash = "0.2.0"
ahash = "0.8.12"

[[bin]]
name = "reverse_to_initial"
path = "src/bin/reverse_to_initial.rs"

[[bin]]
name = "run_filters"
path = "src/bin/run_filters.rs"

[[bin]]
name = "verify_record"
path = "src/bin/verify_record.rs"

[profile.dev]
panic = "unwind"

[profile.release]
lto = true
