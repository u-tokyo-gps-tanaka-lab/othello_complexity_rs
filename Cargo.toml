[package]
name = "othello_complexity_rs"
version = "1.0.0"
edition = "2021"

[dependencies]
proconio = "0.4.5"
ac-library-rs = "0.1.1"
rustsat-kissat = { version= "0.7", features = ["v4-0-4"] }
rustsat = "0.7"
rand = "0.9.2"
rayon = "1.10"
dashmap = "6"
clap = { version = "4", features = ["derive"] }
bytemuck= "1.23.2"
statrs = "0.18.0"
bigdecimal = "0.4"
highs = "1"
highs-sys = "1"
crossbeam-skiplist = "0.1"
crossbeam = "0.8"
ordered-float = "4"
flurry = "0.5"
rapidhash = "4.2.2"
foldhash = "0.2.0"
ahash = "0.8.12"

[[bin]]
name = "reverse_to_initial"
path = "src/bin/reverse_to_initial.rs"

[[bin]]
name = "check"
path = "src/bin/check.rs"

[profile.dev]
panic = "unwind"

[profile.release]
lto = true
